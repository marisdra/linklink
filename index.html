<style>

html,body{margin:0;height:100%;background:#0b0f14;color:#e8eef7;

#hud{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12.5px;

<body>
<div id="app">

<script>
/* ============================================================================
 * 动物连连看 · 核心逻辑（纯函数，浏览器与 Node 均可运行）
 * ----------------------------------------------------------------------------
 * 棋盘带一圈「外边框」，允许路径绕行棋盘外侧（经典连连看规则）。
 * 坐标使用带边距的数组下标：r ∈ [0..rows+1]，c ∈ [0..cols+1]；
 * 0 表示空位，>0 表示某种动物。
 * 连接规则：两个相同动物之间，若存在只经过空位的折线且转弯 ≤ 2 次，即可消除。
 *
 * 关卡布局：11 种图案（对应 0-10 关），决定哪些格子放牌。
 * 棋盘生成算法（已实测 100% 有解）：
 *   反向放置 + 远距离优先 + 有限回溯 DFS；按放置的逆序消除必定能全部消完。
 * ==========================================================================*/
(function (root) {
  'use strict';

  var TYPES = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯',
               '🦁', '🐮', '🐷', '🐸', '🐵', '🦄', '🐔', '🐧', '🐦', '🐤',
               '🦆', '🦉', '🐴', '🐝', '🦋', '🐢', '🐙', '🦀', '🐬', '🐳',
               '🦕', '🦖', '🦔', '🦇', '🐺', '🐗', '🐘', '🐫', '🦒', '🦓',
               '🦌', '🐃', '🐏', '🐐', '🦙', '🦥', '🦦', '🐓', '🦃', '🦚',
               '🦜', '🦩', '🐊', '🦎', '🐍', '🐠', '🐡', '🦈', '🦐', '🦑'];

  var DFS_K = 25;
  var DFS_BUDGET = 6000;
  var PER_TYPE = 4;        // 每种动物在一局里出现的张数（原版实测：恰好 4 张 = 2 对）

  /* ---------- 随机数（可注入种子，便于复现与测试） ---------- */
  function makeRng(seed) {
    var s = (seed === undefined ? Date.now() : seed) >>> 0;
    if (s === 0) s = 0x9e3779b9;
    return function () {
      s ^= s << 13; s >>>= 0;
      s ^= s >>> 17;
      s ^= s << 5;  s >>>= 0;
      return s / 4294967296;
    };
  }

  /* ---------- 棋盘构造 ---------- */
  function makeEmpty(cols, rows) {
    var g = [], r;
    for (r = 0; r < rows + 2; r++) g.push(new Array(cols + 2).fill(0));
    return g;
  }
  function innerCells(cols, rows) {
    var out = [], r, c;
    for (r = 1; r <= rows; r++) for (c = 1; c <= cols; c++) out.push([r, c]);
    return out;
  }
  function cloneGrid(g) { return g.map(function (row) { return row.slice(); }); }
  function remaining(g) {
    var n = 0;
    for (var r = 0; r < g.length; r++) for (var c = 0; c < g[r].length; c++) if (g[r][c]) n++;
    return n;
  }
  function dims(g) { return { cols: g[0].length - 2, rows: g.length - 2 }; }

  /* ============================================================================
   * 11 个关卡的「移动规则」（0-10 关）—— 依据《游戏规则玩法说明》的关卡名
   * ----------------------------------------------------------------------------
   * 关卡名描述的不是静态摆法，而是**每次消除之后牌往哪边移动**：
   *   不变化 / 向下 / 向左 / 上下分离 / 左右分离 / 上下集中 / 左右集中 /
   *   上左下右 / 左下右上 / 向外扩散 / 向内集中
   * 每关开局都是满盘（与原版截图一致），消掉一对后按规则把牌压紧。
   * moves 里每项为 [方向, 模式]：
   *   'row' 逐行、'col' 逐列；
   *   'first' 压向起点（上/左）、'last' 压向终点（下/右）、
   *   'center' 向中线聚拢、'edges' 按原来在前/后半分别压向两端。
   * ==========================================================================*/
  var LEVELS = [
    { key: 'none',    name: '不变化',   moves: [] },
    { key: 'down',    name: '向下',     moves: [['col', 'last']] },
    { key: 'left',    name: '向左',     moves: [['row', 'first']] },
    { key: 'vsplit',  name: '上下分离', moves: [['col', 'edges']] },
    { key: 'hsplit',  name: '左右分离', moves: [['row', 'edges']] },
    { key: 'vgather', name: '上下集中', moves: [['col', 'center']] },
    { key: 'hgather', name: '左右集中', moves: [['row', 'center']] },
    { key: 'diagBR',  name: '上左下右', moves: [['row', 'last'], ['col', 'last']] },
    { key: 'diagTR',  name: '左下右上', moves: [['row', 'last'], ['col', 'first']] },
    { key: 'outward', name: '向外扩散', moves: [['row', 'edges'], ['col', 'edges']] },
    { key: 'inward',  name: '向内集中', moves: [['row', 'center'], ['col', 'center']] }
  ];

  /** 取某关的规则信息 */
  function levelInfo(level) {
    return LEVELS[Math.max(0, Math.min(level | 0, LEVELS.length - 1))];
  }

  /** 计算一条线上 n 张牌的目标位置（1..len）；froms 是它们原来在这条线上的位置 */
  function lineTargets(n, len, mode, froms) {
    var out = [], i, mid = len / 2;
    if (mode === 'first') { for (i = 0; i < n; i++) out.push(i + 1); return out; }
    if (mode === 'last') { for (i = 0; i < n; i++) out.push(len - n + 1 + i); return out; }
    if (mode === 'center') {
      var st = Math.floor((len - n) / 2) + 1;
      for (i = 0; i < n; i++) out.push(st + i);
      return out;
    }
    // edges：按原来在前半/后半分两组，分别压向两端
    var up = [], down = [];
    for (i = 0; i < n; i++) (froms[i] <= mid ? up : down).push(i);
    out = new Array(n);
    for (i = 0; i < up.length; i++) out[up[i]] = 1 + i;
    var ds = len - down.length + 1;
    for (i = 0; i < down.length; i++) out[down[i]] = ds + i;
    return out;
  }

  /* 注意：多程规则（如上左下右＝先逐行再逐列）里，第二程的"起点"是第一程之后的位置。
     所以这里同时搬运一个「牌的身份」数组 ids，最后用身份对比算出
     「原始位置 → 最终位置」的**净移动列表**，界面照它搬方块才不会搬错。 */
  function packCols(g, ids, mode) {
    var d = dims(g), rows = d.rows, cols = d.cols, c, r, i;
    for (c = 1; c <= cols; c++) {
      var vals = [], vids = [], froms = [];
      for (r = 1; r <= rows; r++) if (g[r][c]) { vals.push(g[r][c]); vids.push(ids[r][c]); froms.push(r); }
      if (!vals.length) continue;
      var pos = lineTargets(vals.length, rows, mode, froms);
      for (r = 1; r <= rows; r++) { g[r][c] = 0; ids[r][c] = 0; }
      for (i = 0; i < vals.length; i++) { g[pos[i]][c] = vals[i]; ids[pos[i]][c] = vids[i]; }
    }
  }

  function packRows(g, ids, mode) {
    var d = dims(g), rows = d.rows, cols = d.cols, c, r, i;
    for (r = 1; r <= rows; r++) {
      var vals = [], vids = [], froms = [];
      for (c = 1; c <= cols; c++) if (g[r][c]) { vals.push(g[r][c]); vids.push(ids[r][c]); froms.push(c); }
      if (!vals.length) continue;
      var pos = lineTargets(vals.length, cols, mode, froms);
      for (c = 1; c <= cols; c++) { g[r][c] = 0; ids[r][c] = 0; }
      for (i = 0; i < vals.length; i++) { g[r][pos[i]] = vals[i]; ids[r][pos[i]] = vids[i]; }
    }
  }

  /** 按关卡规则把牌压紧（原地修改 g）；返回净移动列表 [[r1,c1,r2,c2], ...] */
  function applyGravity(g, ruleKey) {
    var lv = null, i, r, c;
    for (i = 0; i < LEVELS.length; i++) if (LEVELS[i].key === ruleKey) lv = LEVELS[i];
    if (!lv || !lv.moves.length) return [];
    var d = dims(g), rows = d.rows, cols = d.cols;
    var ids = [], pos0 = {}, nextId = 1;
    for (r = 0; r < rows + 2; r++) ids.push(new Array(cols + 2).fill(0));
    for (r = 1; r <= rows; r++) for (c = 1; c <= cols; c++) {
      if (g[r][c]) { ids[r][c] = nextId; pos0[nextId] = [r, c]; nextId++; }
    }
    for (i = 0; i < lv.moves.length; i++) {
      var mv = lv.moves[i];
      if (mv[0] === 'col') packCols(g, ids, mv[1]); else packRows(g, ids, mv[1]);
    }
    var moves = [];
    for (r = 1; r <= rows; r++) for (c = 1; c <= cols; c++) {
      var id = ids[r][c];
      if (!id) continue;
      var p = pos0[id];
      if (p[0] !== r || p[1] !== c) moves.push([p[0], p[1], r, c]);
    }
    return moves;
  }

  /* ---------- 基础判定 ---------- */
  function lineClear(g, r1, c1, r2, c2) {
    var i;
    if (r1 === r2) {
      var lo = Math.min(c1, c2) + 1, hi = Math.max(c1, c2);
      for (i = lo; i < hi; i++) if (g[r1][i]) return false;
      return true;
    }
    if (c1 === c2) {
      var lo2 = Math.min(r1, r2) + 1, hi2 = Math.max(r1, r2);
      for (i = lo2; i < hi2; i++) if (g[i][c1]) return false;
      return true;
    }
    return false;
  }
  function free(g, r, c) {
    return r >= 0 && r < g.length && c >= 0 && c < g[0].length && g[r][c] === 0;
  }

  /* 空格↔空格 的连通判断（生成阶段两端都还是空位） */
  function findPathRaw(g, a, b) {
    var r1 = a[0], c1 = a[1], r2 = b[0], c2 = b[1], i, k, d, r, c, cr, cc, cs, mr, mc;
    if (r1 === r2 && c1 === c2) return null;
    if ((r1 === r2 || c1 === c2) && lineClear(g, r1, c1, r2, c2)) return [[r1, c1], [r2, c2]];
    var corners = [[r1, c2], [r2, c1]];
    for (i = 0; i < corners.length; i++) {
      cr = corners[i][0]; cc = corners[i][1];
      if (free(g, cr, cc) && lineClear(g, r1, c1, cr, cc) && lineClear(g, cr, cc, r2, c2)) {
        return [[r1, c1], [cr, cc], [r2, c2]];
      }
    }
    var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (d = 0; d < 4; d++) {
      r = r1 + dirs[d][0]; c = c1 + dirs[d][1];
      while (free(g, r, c)) {
        if ((r === r2 || c === c2) && lineClear(g, r, c, r2, c2)) return [[r1, c1], [r, c], [r2, c2]];
        cs = [[r, c2], [r2, c]];
        for (k = 0; k < cs.length; k++) {
          mr = cs[k][0]; mc = cs[k][1];
          if (free(g, mr, mc) && lineClear(g, r, c, mr, mc) && lineClear(g, mr, mc, r2, c2)) {
            return [[r1, c1], [r, c], [mr, mc], [r2, c2]];
          }
        }
        r += dirs[d][0]; c += dirs[d][1];
      }
    }
    return null;
  }

  /** 两个已放好的同类动物之间的合法路径（转弯 ≤ 2），返回折线点数组或 null */
  function findPath(g, a, b) {
    if (g[a[0]][a[1]] === 0 || g[a[0]][a[1]] !== g[b[0]][b[1]]) return null;
    return findPathRaw(g, a, b);
  }

  /** 找出任意一对可消的动物（含路径），没有返回 null */
  function findAnyPair(g) {
    var byVal = {}, r, c, v, i, j, list, p;
    for (r = 0; r < g.length; r++) {
      for (c = 0; c < g[r].length; c++) {
        v = g[r][c];
        if (!v) continue;
        (byVal[v] = byVal[v] || []).push([r, c]);
      }
    }
    for (v in byVal) {
      list = byVal[v];
      for (i = 0; i < list.length; i++) {
        for (j = i + 1; j < list.length; j++) {
          p = findPath(g, list[i], list[j]);
          if (p) return { a: list[i], b: list[j], path: p };
        }
      }
    }
    return null;
  }
  function hasMove(g) { return findAnyPair(g) !== null; }

  /* ---------- 反向放置 + 远距离优先 + 有限回溯 ---------- */
  function manhattan(a, b) { return Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]); }

  function placePairs(g, cells, values, rng, order) {
    var nodes = 0;
    function feasiblePairs() {
      var fc = [], i, j, out = [];
      for (i = 0; i < cells.length; i++) {
        if (g[cells[i][0]][cells[i][1]] === 0) fc.push(cells[i]);
      }
      for (i = 0; i < fc.length; i++) {
        for (j = i + 1; j < fc.length; j++) {
          if (findPathRaw(g, fc[i], fc[j])) {
            out.push({ a: fc[i], b: fc[j], d: manhattan(fc[i], fc[j]) + rng() * 0.8 });
          }
        }
      }
      out.sort(function (x, y) { return y.d - x.d; });
      return out.length > DFS_K ? out.slice(0, DFS_K) : out;
    }
    function step(k) {
      nodes++;
      if (nodes > DFS_BUDGET) return false;
      if (k === values.length) return true;
      var cands = feasiblePairs();
      if (!cands.length) return false;
      var v = values[k], t, cd;

  }

  function applyTheme() {
    if (!boardWrap) return;
    var key = game.state.seed + ':' + game.state.level + ':' + game.state.diff.key;
    if (key !== themeKey) { themeKey = key; curTheme = pickTheme(); }
    var s = boardWrap.style, t = curTheme;
    s.setProperty('--board', t.board);
    s.setProperty('--tileTop', t.tileTop);
    s.setProperty('--tileBot', t.tileBot);
    s.setProperty('--tileBorder', t.tileBorder);
    s.setProperty('--tileHi', t.tileHi);
    s.setProperty('--frame1', t.frame1);
    s.setProperty('--frame2', t.frame2);
    boardWrap.setAttribute('data-theme', t.key);
  }

  /* ---------------- 布局 ---------------- */
  var lastW = 0, lastH = 0;
  function layout(force) {
    var g = game.state.grid;
    if (!g) return;
    var cols = game.state.cols, rows = game.state.rows;
    var sw = stage.clientWidth, sh = stage.clientHeight;
    if (!sw || !sh) return;
    // 手机浏览器的地址栏会自动隐藏/显示，导致可视高度变化；
    // 若据此重算方块大小，玩起来就像"屏幕一点一点变大"。所以小幅变化时沿用原尺寸。
    if (!force && lastW && tileSize > 0 &&
        Math.abs(sw - lastW) / lastW < 0.08 && Math.abs(sh - lastH) / lastH < 0.18) {
      positionTiles();
      return;
    }
    lastW = sw; lastH = sh;
    var size = Math.floor(Math.min((sw - 8) / cols, (sh - 8) / rows));
    tileSize = Math.max(12, size);
    var bw = tileSize * cols, bh = tileSize * rows;
    boardEl.style.width = bw + 'px'; boardEl.style.height = bh + 'px';
    canvas.style.width = bw + 'px'; canvas.style.height = bh + 'px';
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(bw * dpr); canvas.height = Math.round(bh * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    positionTiles();
  }

  /* 彻底禁掉移动端的缩放手势：双击放大、双指缩放、以及微信内置浏览器的双击缩放 */
  function blockZoom() {
    function stop(e) { if (e.cancelable) e.preventDefault(); }
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) {
      document.addEventListener(n, stop, { passive: false });
    });
    document.addEventListener('dblclick', stop, { passive: false });
    // 微信/X5 等内核只认 touch 事件的 preventDefault
    ['touchstart', 'touchend', 'touchmove'].forEach(function (n) {
      boardEl.addEventListener(n, stop, { passive: false });
      stage.addEventListener(n, stop, { passive: false });
    });
    // 兜底：两次点击间隔 < 350ms 时（＝一次双击手势），第二次的 touch 一律拦掉
    var lastTap = 0;
    boardEl.addEventListener('touchend', function (e) {
      var now = Date.now();
      if (now - lastTap < 350 && e.cancelable) e.preventDefault();
      lastTap = now;
    }, { passive: false });
  }

  function positionTiles() {
    // 参考原版风格：牌与牌紧贴、共享网格线（无间隙、无圆角）
    var inner = tileSize;
    for (var key in tileEls) {
      var el = tileEls[key];
      var r = +el.getAttribute('data-r'), c = +el.getAttribute('data-c');
      el.style.left = ((c - 1) * tileSize) + 'px';
      el.style.top = ((r - 1) * tileSize) + 'px';
      el.style.width = inner + 'px';
      el.style.height = inner + 'px';
      el.style.fontSize = Math.round(inner * 0.70) + 'px';
    }
  }

  /* 消掉一个方块：立刻从映射移除并淡出，200ms 后从 DOM 拿掉 */
  function removeTile(r, c) {
    var key = r * 100 + c, el = tileEls[key];
    if (!el) return;
    delete tileEls[key];
    el.classList.add('gone');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 200);
  }

  /* ---------------- 渲染 ---------------- */
  function render(full) {
    var g = game.state.grid;
    if (!g) return;
    var cols = game.state.cols, rows = game.state.rows, r, c, key, v, el;
    if (full) {
      applyTheme();
      while (boardEl.firstChild) boardEl.removeChild(boardEl.firstChild);
      tileEls = {};
    }
    for (r = 1; r <= rows; r++) {
      for (c = 1; c <= cols; c++) {
        key = r * 100 + c; v = g[r][c];
        if (v) {
          el = tileEls[key];
          if (!el) {
            el = document.createElement('div');
            el.className = 'tile';
            el.setAttribute('data-r', r); el.setAttribute('data-c', c);
            boardEl.appendChild(el);
            tileEls[key] = el;
          }
          el.textContent = Core.TYPES[(v - 1) % Core.TYPES.length];
        } else if (tileEls[key]) {
          (function (dead) {
            delete tileEls[key];
            dead.classList.add('gone');
            setTimeout(function () { if (dead.parentNode) dead.parentNode.removeChild(dead); }, 200);
          })(tileEls[key]);
        }
      }
    }
    layout(!!full);
    updateSelection();
    updateHud(true);
  }

  function updateSelection() {
    var sel = game.state.selected;
    for (var key in tileEls) {
      var el = tileEls[key];
      var on = sel && (+el.getAttribute('data-r') === sel[0]) && (+el.getAttribute('data-c') === sel[1]);
      if (on) el.classList.add('sel'); else el.classList.remove('sel');
    }
  }

  var hudCache = {}, barTick = 0;
  function setText(el, key, val) { if (hudCache[key] === val) return; hudCache[key] = val; el.textContent = val; }
  function updateHud(force) {
    var s = game.state;
    setText(hudDiff, 'diff', s.diff.name);
    setText(hudLevel, 'level', (s.level + 1) + '/' + (Game.LAST_LEVEL + 1) + ' · ' + s.levelName);
    setText(hudLives, 'lives', String(s.life));
    setText(hudHints, 'hints', String(s.hints));
    setText(hudScore, 'score', String(s.score));
    var now = performance.now();
    if (!force && now - barTick < 100) return;
    barTick = now;
    var frac = s.timeTotal ? Math.max(0, Math.min(1, s.timeLeft / s.timeTotal)) : 0;
    timeBar.style.transform = 'scaleX(' + frac.toFixed(4) + ')';
    timeBar.style.background = frac < 0.2 ? '#ff4d4f' : (frac < 0.5 ? '#ffb300' : '#e8443a');
  }

  /* ---------------- 连线特效 ---------------- */
  function pushPath(path, color, ms) {
    var pts = path.map(function (p) { return [(p[1] - 0.5) * tileSize, (p[0] - 0.5) * tileSize]; });
    fx.push({ pts: pts, color: color || '#ffd54f', t0: performance.now(), ms: ms || 320 });
    drawFx(performance.now());
  }
  function drawFx(ts) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!fx.length) return;
    var keep = [];
    for (var i = 0; i < fx.length; i++) {
      var f = fx[i], k = (ts - f.t0) / f.ms;
      if (k >= 1) continue;
      keep.push(f);
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = f.color;
      ctx.lineWidth = Math.max(2, tileSize * 0.09);
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(f.pts[0][0], f.pts[0][1]);
      for (var j = 1; j < f.pts.length; j++) ctx.lineTo(f.pts[j][0], f.pts[j][1]);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    fx = keep;
  }

  /* ---------------- 提示条 ---------------- */
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1600);
  }

  /* ---------------- 遮罩 ---------------- */
  function showOverlay(title, bodyHtml, buttons) {
    paused = true;
    ovTitle.textContent = title;
    ovBody.innerHTML = bodyHtml;
    ovBtns.innerHTML = '';
    buttons.forEach(function (b) {
      var el = document.createElement('button');
      el.className = 'big' + (b.primary ? ' primary' : '');
      el.textContent = b.label;
      el.onclick = b.onClick;
      ovBtns.appendChild(el);
    });
    overlay.classList.add('show');
    hidePause();
  }
  function hideOverlay() { overlay.classList.remove('show'); paused = false; lastTickAt = 0; }

  /* ---------------- 暂停（隐藏牌面） ---------------- */
  function showPause() {
    if (!game.state.running || game.state.over) return;
    if (overlay.classList.contains('show')) return;
    paused = true;
    pauseCover.classList.add('show');
    $('pauseInfo').textContent = '第 ' + (game.state.level + 1) + ' 关 · ' + game.state.levelName +
      '　剩余 ' + Math.ceil(game.state.timeLeft) + ' 秒';
  }
  function hidePause() { pauseCover.classList.remove('show'); }
  function resume() {
    if (overlay.classList.contains('show')) return;
    hidePause();
    if (game.state.running && !game.state.over) { paused = false; lastTickAt = 0; }
  }

  /* ---------------- 存档 ---------------- */
  function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(game.snapshot())); } catch (e) { } }
  function loadSave() { try { var s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function clearSave() { try { localStorage.removeItem(LS_KEY); } catch (e) { } }

  /* ---------------- 首页 ---------------- */
  function startScreen() {
    var saved = loadSave();
    var body = '<p>点两个相同的动物，把它们连起来（最多转两个弯，可以绕棋盘外圈）。' +
      '在时间内消完全部即过关；<b>时间到本局就结束</b>。</p>' +
      '<p><b>生命点数＝洗牌次数</b>：出现无解会自动扣 1 点并重排，手动「重新洗牌」也扣 1 点；每过一关 +1。' +
      '生命为 0 又遇到无解就结束。</p>' +
      '<p class="dim">每种难度 11 关，每关牌面图案不同（不变化 / 向下 / 向左 / 上下分离 … 向内集中）。' +
      '提示每过一关 +1。</p>';
    var btns = [
      { label: '初级 · 12×7（生命2 提示4）', onClick: function () { newGame('easy'); } },
      { label: '中级 · 14×8（生命3 提示6）', primary: true, onClick: function () { newGame('normal'); } },
      { label: '高级 · 16×9（生命4 提示8）', onClick: function () { newGame('hard'); } }
    ];
    if (saved && saved.grid && Core.remaining(saved.grid) > 0) {
      btns.unshift({
        label: '继续上次（第 ' + ((saved.level || 0) + 1) + ' 关 · ' + (saved.score || 0) + ' 分）',
        primary: true,
        onClick: function () {
          if (game.restore(saved)) { hideOverlay(); render(true); toast('已继续上次进度'); }
          else { toast('存档已损坏'); }
        }
      });
    }
    btns.push({ label: '玩法说明', onClick: function () { helpScreen(); } });
    showOverlay('动物连连看', body, btns);
  }

  function helpScreen() {
    var body = '<p><b>怎么玩</b><br>点两个相同的动物，若它们之间的通路最多转 2 个弯（可绕棋盘外圈），就一起消掉。</p>' +
      '<p><b>过关</b><br>在时间内消完本关全部牌子才进入下一关；时间到本局结束。</p>' +
      '<p><b>生命点数（＝洗牌次数）</b><br>无解时自动扣 1 点并重排；手动「重新洗牌」扣 1 点；每过一关 +1；' +
      '生命为 0 且无解 → 游戏结束。</p>' +
      '<p><b>提示</b><br>显示一组可消的牌；每过一关 +1，用完为止。</p>' +
      '<p><b>分数</b><br>每消一对按关数加重给分；过关另有奖励（第1关 +200、第2关 +400、第7关 +2800…），' +
      '关末再把剩余时间、生命、提示按关数折算加分。</p>' +
      '<p><b>11 关的移动规则</b><br>每关开局都是满盘；消掉一对后，剩下的牌按本关规则移动：<br>' +
      '不变化（不动）· 向下 · 向左 · 上下分离 · 左右分离 · 上下集中 · 左右集中 · ' +
      '上左下右 · 左下右上 · 向外扩散 · 向内集中</p>' +
      '<p class="dim">关于：动物连连看（离线单文件版）· 2026-10-12 · 依据〈游戏规则玩法说明〉实现</p>';
    showOverlay('玩法说明', body, [
      { label: '返回', primary: true, onClick: function () { startScreen(); } }
    ]);
  }

  function newGame(diff) {
    clearSave();
    if (game.start(diff)) { hideOverlay(); render(true); toast('开始新游戏：' + game.state.diff.name + ' · 第 1 关 ' + game.state.levelName); }
    else { toast('生成棋盘失败'); }
  }

  /* ---------------- 事件接线 ---------------- */
  function wire() {
    game.on('render', function (full) { render(!!full); });
    game.on('select', function () { updateSelection(); });
    game.on('tick', function () { updateHud(); });

    game.on('match', function (e) {
      beep(880, 0.09, 'sine', 0.05);
      setTimeout(function () { beep(1180, 0.07, 'sine', 0.04); }, 55);
      pushPath(e.path, '#ffd54f', 320);
      removeTile(e.a[0], e.a[1]);
      removeTile(e.b[0], e.b[1]);
      if (e.combo >= 2) toast('连击 ×' + e.combo);
      save();
    });

    /* 关卡移动规则（向下 / 向左 / … / 向内集中）：搬动已有方块元素，带滑动动画
       注意：必须按「原始位置」统一建新映射。若边搬边改，遇到链式移动
       （A→B、B→C）会把刚放到 B 的元素又删掉，界面就会出现重复方块。 */
    game.on('gravity', function (moves) {
      var from = {}, next = {}, k, i, m, el;
      for (i = 0; i < moves.length; i++) from[moves[i][0] * 100 + moves[i][1]] = moves[i];
      for (k in tileEls) {
        m = from[k];
        el = tileEls[k];
        if (m) {
          el.setAttribute('data-r', m[2]);
          el.setAttribute('data-c', m[3]);
          next[m[2] * 100 + m[3]] = el;
        } else {
          next[k] = el;
        }
      }
      tileEls = next;
      positionTiles();
    });

    game.on('hint', function (pair) {
      beep(520, 0.08, 'triangle', 0.04);
      pushPath(pair.path, '#4fc3f7', 1600);
      [pair.a, pair.b].forEach(function (p) {
        var el = tileEls[p[0] * 100 + p[1]];
        if (!el) return;
        el.classList.add('hint');
        setTimeout(function () { el.classList.remove('hint'); }, 1600);
      });
    });

    game.on('wrong', function (msg) { beep(180, 0.12, 'square', 0.04); toast(msg); });
    game.on('toast', function (msg) { toast(msg); });

    game.on('win', function (e) {
      clearSave();
      chord([[660, 0.12], [880, 0.12], [1180, 0.18]]);
      var body = '<p>第 ' + ((e.level || 0) + 1) + ' 关 · ' + e.levelName + '　剩余 ' + e.timeLeft + ' 秒</p>' +
        '<p>过关奖励 <b>+' + e.bonus + '</b><br>' +
        '时间折算 +' + e.timeBonus + '　生命折算 +' + e.lifeBonus + '　提示折算 +' + e.hintBonus + '<br>' +
        '本关额外合计 <b>+' + e.total + '</b></p>' +
        '<p>总分 <b>' + e.score + '</b></p>' +
        '<p class="dim">下一关生命与提示各 +1</p>';
      var btns = [];
      if (!e.last) {
        btns.push({ label: '进入第 ' + ((e.level || 0) + 2) + ' 关', primary: true, onClick: function () {
          if (game.nextLevel()) { hideOverlay(); render(true); toast('第 ' + (game.state.level + 1) + ' 关：' + game.state.levelName); }
        } });
      }
      btns.push({ label: '回到首页', onClick: function () { startScreen(); } });
      showOverlay('过关！', body, btns);
    });

    game.on('allwin', function (e) {
      chord([[660, 0.12], [880, 0.12], [1180, 0.12], [1560, 0.2]]);
      showOverlay('全部 11 关通关！🎉',
        '<p>你完成了所有关卡图案。</p><p>最终总分 <b>' + e.score + '</b></p>' +
        '<p class="dim">换个难度再来一遍？</p>',
        [{ label: '回到首页', primary: true, onClick: function () { startScreen(); } }]);
    });

    game.on('lose', function (e) {
      clearSave();
      chord([[440, 0.14], [330, 0.14], [220, 0.22]]);
      var why = e.reason === 'timeout' ? '时间用完了' :
        (e.reason === 'no-move' ? '生命点数用完，且已无可消的对' : '本局结束');
      showOverlay('游戏结束',
        '<p>' + why + '</p><p>到达第 <b>' + (e.levelNo || 1) + '</b> 关（' + (e.levelName || '') + '）</p>' +
        '<p>得分 <b>' + e.score + '</b></p>',
        [{ label: '再来一局', primary: true, onClick: function () { startScreen(); } }]);
    });

    /* 输入 */
    boardEl.addEventListener('pointerdown', function (ev) {
      if (paused) return;
      var rect = boardEl.getBoundingClientRect();
      var c = Math.floor((ev.clientX - rect.left) / tileSize) + 1;
      var r = Math.floor((ev.clientY - rect.top) / tileSize) + 1;
      if (r < 1 || c < 1 || r > game.state.rows || c > game.state.cols) return;
      var hadSel = !!game.state.selected;
      var res = game.tap(r, c);
      if (res && res.ok && res.action === 'select' && !hadSel) beep(600, 0.04, 'sine', 0.03);
      ev.preventDefault();
    }, { passive: false });

    $('btnHint').onclick = function () { game.useHint(); };
    $('btnShuffle').onclick = function () { game.shuffle(); save(); };
    $('btnPause').onclick = function () { showPause(); };
    $('btnResume').onclick = function () { resume(); };
    $('btnSound').onclick = function () {
      muted = !muted;
      try { localStorage.setItem(LS_MUTE, muted ? '1' : '0'); } catch (e) { }
      this.textContent = muted ? '🔇' : '🔊';
      if (!muted) beep(700, 0.06, 'sine', 0.05);
    };
    $('btnFull').onclick = function () {
      try {
        if (!document.fullscreenElement) (document.documentElement.requestFullscreen || function () { }).call(document.documentElement);
        else document.exitFullscreen();
      } catch (e) { }
    };
    $('btnMenu').onclick = function () {
      save();
      showOverlay('菜单', '<p class="dim">当前：第 ' + (game.state.level + 1) + ' 关 · ' + game.state.levelName +
        '　得分 ' + game.state.score + '</p>', [
        { label: '继续游戏', primary: true, onClick: function () { hideOverlay(); } },
        { label: '重开本关', onClick: function () {
            clearSave();
            if (game.restartLevel()) { hideOverlay(); render(true); } else { toast('重开失败'); }
          } },
        { label: '玩法说明', onClick: function () { helpScreen(); } },
        { label: '回到首页', onClick: function () { startScreen(); } }
      ]);
    };

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        if (overlay.classList.contains('show')) return;
        if (pauseCover.classList.contains('show')) resume(); else showPause();
      }
    });
    window.addEventListener('resize', function () { layout(false); });
    window.addEventListener('orientationchange', function () { setTimeout(function () { layout(true); }, 250); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { if (game.state.running && !game.state.over) showPause(); save(); }
      else { lastTickAt = 0; }
    });
    window.addEventListener('pagehide', save);
    setInterval(function () { if (!paused && game.state.running) save(); }, 5000);
  }

  /* ---------------- 主循环：计时用 setInterval（不依赖 rAF） ---------------- */
  function startClock() {
    setInterval(function () {
      var now = Date.now();
      if (paused || !game.state.running) { lastTickAt = now; return; }
      var dt = lastTickAt ? now - lastTickAt : 0;
      lastTickAt = now;
      if (dt <= 0) return;
      if (dt > 500) dt = 500;
      game.tick(dt);
    }, 100);
    (function frame(ts) { requestAnimationFrame(frame); drawFx(ts); })(0);
    setInterval(function () { drawFx(performance.now()); }, 80);
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
    stage = $('stage'); boardEl = $('board'); canvas = $('fx'); ctx = canvas.getContext('2d');
    boardWrap = $('boardWrap');
    hudDiff = $('hudDiff'); hudLevel = $('hudLevel'); hudLives = $('hudLives');
    hudHints = $('hudHints'); hudScore = $('hudScore'); timeBar = $('timeBar');
    toastEl = $('toast'); overlay = $('overlay'); ovTitle = $('ovTitle'); ovBody = $('ovBody'); ovBtns = $('ovBtns');
    pauseCover = $('pauseCover');
    try { muted = localStorage.getItem(LS_MUTE) === '1'; } catch (e) { }
    $('btnSound').textContent = muted ? '🔇' : '🔊';
    wire();
    blockZoom();
    game.start('normal');
    game.state.running = false;
    render(true);
    startClock();
    try { window.LinkGameDebug = game; } catch (e) { }   // 调试/自动化用（可查看与驱动状态）
    setTimeout(function () { layout(); startScreen(); }, 60);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();


</script>
<script>
/* PWA：仅在 http/https 下注册离线缓存；file:// 打开时直接跳过，不影响单文件用法 */
(function () {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { });
  });
})();
</script>
